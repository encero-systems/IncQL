[project]
name = "incql"
version = "0.1.0"

# Oven bakes only `src/main.incn`, `src/lib.incn`, and the entry points declared
# here. `make registry-metadata` runs the checker below through `incan run`, so
# it has to be a declared target or its dependency closure is never compiled.
[project.scripts]
check_function_registry_metadata = "scripts/check_function_registry_metadata.incn"

[rust-dependencies]
# Protobuf serialization and deserialization are provided via prost in the proto module.
prost = "0.14"
prost-types = "0.14"
# Build needs `protoc` on PATH (`brew install protobuf`), or `features = ["protoc"]` + CMake.
substrait = { version = "0.63", features = ["protoc"] }
# Datafusion is IncQL default query engine, and provides the Substrait to Datafusion translation.
datafusion = "53"
datafusion_common = { package = "datafusion-common", version = "53" }
datafusion_expr = { package = "datafusion-expr", version = "53" }
datafusion-substrait = { version = "53", features = ["protoc"] }
crc32fast = "1.5"
url = "2.5"

[vocab]
crate = "vocab_companion"
