# IncQL CI — Incan library package
#
# Installs the pinned Incan **release** toolchain and runs the IncQL package
# checks against it.
#
# Why the release archive rather than a source build: since Incan 0.5, a project
# that declares a `[vocab]` companion (IncQL does — see `incan.toml`) needs a
# compiler-owned vocabulary helper drawn from a release-cohort Oven Loaf. Those
# Loafs are sealed into the release archive by Incan's packaging and are *not*
# produced by `cargo build` on a source checkout, so a from-source compiler
# cannot build this package at all.
#
# Why an Incan checkout is still needed: the release archive deliberately drops
# the stdlib component sources (`crates/incan_stdlib/stdlib`). `incan tools
# metadata api`, used by the registry-metadata gate, prepares SDK components
# from that tree. So CI takes the binary and its Loafs from the release, and the
# stdlib sources from a checkout at the matching tag, wired up via INCAN_STDLIB.
# Nothing is compiled from the checkout.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned Incan release. INCAN_TAG selects both the toolchain archive and the
  # stdlib-source checkout; the two must always name the same release.
  INCAN_TAG: v0.5.1
  EXPECTED_INCAN_VERSION: 0.5.1
  # The release Loafs are sealed against an exact `rustc --version` identity and
  # are verified against it, so this must name a concrete version. A floating
  # `stable` channel drifts out from under the release the moment upstream
  # publishes a new compiler.
  RUST_VERSION: 1.98.0
  RUST_BACKTRACE: 1
  INCAN_NO_BANNER: 1
  INCAN_GENERATED_CARGO_TARGET_DIR: ${{ github.workspace }}/.incan-generated-cargo-target
  INCAN_TEST_SHARED_TARGET_DIR: ${{ github.workspace }}/.incan-generated-cargo-target

jobs:
  incql:
    name: IncQL (build + test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Check out IncQL
        uses: actions/checkout@v4

      # Checked out for its stdlib component sources only — never built here.
      - name: Check out Incan stdlib sources
        uses: actions/checkout@v4
        with:
          repository: encero-systems/incan
          ref: ${{ env.INCAN_TAG }}
          path: incan

      # `targets` is not optional here: IncQL declares a `[vocab]` companion, and
      # its desugarer is compiled to wasm32-wasip1. The toolchain the official
      # installer provisions includes that target; a workflow that provisions
      # rustup itself has to add it, or `oven bake` stops with
      # "vocab desugarer target `wasm32-wasip1` is not installed".
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-wasip1
          components: llvm-tools

      - name: Cache Incan release toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/incan-toolchain
          key: incql-incan-release-${{ runner.os }}-${{ matrix.target }}-${{ env.INCAN_TAG }}

      - name: Install Incan release toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          archive="incan-${INCAN_TAG}-${{ matrix.target }}.tar.gz"
          workdir="$(mktemp -d)"
          gh release download "$INCAN_TAG" \
            --repo encero-systems/incan \
            --pattern "$archive" \
            --pattern "$archive.sha256" \
            --dir "$workdir"
          # The published .sha256 holds a bare digest, so compare it directly
          # rather than feeding it to `shasum -c`, which wants "digest  name".
          expected="$(tr -d '[:space:]' < "$workdir/$archive.sha256")"
          actual="$(shasum -a 256 "$workdir/$archive" | awk '{ print $1 }')"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Incan archive checksum mismatch (expected $expected, got $actual)"
            exit 1
          fi
          mkdir -p "${{ runner.temp }}/incan-toolchain"
          tar -xzf "$workdir/$archive" -C "${{ runner.temp }}/incan-toolchain"
          rm -rf "$workdir"

      - name: Expose Incan on PATH
        run: |
          set -euo pipefail
          echo "${{ runner.temp }}/incan-toolchain/bin" >> "$GITHUB_PATH"
          # The release archive ships no stdlib component sources; point the
          # toolchain at the matching checkout so SDK component preparation
          # (used by `incan tools metadata api`) can resolve them.
          stdlib="${{ github.workspace }}/incan/crates/incan_stdlib/stdlib"
          test -d "$stdlib" || { echo "::error::stdlib sources missing at $stdlib"; exit 1; }
          echo "INCAN_STDLIB=$stdlib" >> "$GITHUB_ENV"
          echo "INCAN_STDLIB_DIR=$stdlib" >> "$GITHUB_ENV"

      - name: Cache generated IncQL Cargo artifacts
        uses: actions/cache@v4
        with:
          path: .incan-generated-cargo-target
          key: incql-generated-cargo-${{ runner.os }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('incan.lock', 'incan.toml') }}
          restore-keys: |
            incql-generated-cargo-${{ runner.os }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-rust-${{ env.RUST_VERSION }}-

      - name: Cache generated IncQL Rust metadata
        uses: actions/cache@v4
        with:
          path: |
            target/incan_lock/rust_inspect/**/Cargo.toml
            target/incan_lock/rust_inspect/**/Cargo.lock
            target/incan_lock/rust_inspect/**/src/main.rs
            target/incan_lock/rust_inspect/**/.incan_rust_inspect_cache.json
            target/incan_lock/rust_inspect/**/.incan_rust_inspect_fingerprint
          key: incql-rust-inspect-${{ runner.os }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ hashFiles('incan.lock', 'incan.toml') }}-${{ hashFiles('src/**/*.incn', 'tests/**/*.incn', 'scripts/**/*.incn') }}
          restore-keys: |
            incql-rust-inspect-${{ runner.os }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ hashFiles('incan.lock', 'incan.toml') }}-
            incql-rust-inspect-${{ runner.os }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-

      # The release archive vendors only Incan's own crates by design; a
      # project's extension dependencies build from the consumer's `~/.cargo`,
      # resolved `--offline` by the Oven publisher. On a cold runner that fails
      # on the first extension crate it needs — for IncQL, `blake2`, pulled in by
      # the stdlib hashing components. Keyed on the lock, mirroring Incan's own
      # `incan-oven-pr-sources` cache.
      - name: Cache Cargo registry for Oven extension sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incql-oven-sources-v1-${{ runner.os }}-${{ runner.arch }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ hashFiles('incan.lock', 'incan.toml') }}
          restore-keys: |
            incql-oven-sources-v1-${{ runner.os }}-${{ runner.arch }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-
            incql-oven-sources-v1-${{ runner.os }}-${{ runner.arch }}-

      # One online fetch before the bake, so a cold runner degrades to a slow
      # run rather than an aborted bake. `incan.lock` already names every
      # registry crate and exact version in the closure, so seed precisely
      # those rather than guessing.
      #
      # This matters beyond the immediate failure: a bake that stops mid-flight
      # damages the checkout's inspection authority (encero-systems/incan#1229),
      # and every later bake in that checkout then reports spurious `Box` type
      # errors until `.incan`, `target/incan_lock` and `target/incan` are
      # removed. Failing before the bake starts is much cheaper than failing
      # inside it.
      # Seeding from `incan.lock` is not enough: the project Cargo manifest that
      # Oven generates uses caret ranges (`blake2 = "0.10"`, `datafusion = "53"`),
      # so it resolves to the newest compatible versions rather than the lock's
      # pins. The only reliable description of what the bake needs is the
      # manifest the bake itself writes.
      #
      # So: let a first bake generate that manifest and fail offline, fetch what
      # it asked for while online, then clear the damaged state and let the real
      # bake step run against a warm registry.
      #
      # The clear is not optional. A bake that stops mid-flight damages the
      # checkout's inspection authority (encero-systems/incan#1229), and every
      # later bake in that checkout then reports spurious `Box` type errors —
      # `expected 'prost::alloc::boxed::Box<…>', found 'rust::std::boxed::Box'` —
      # until `.incan`, `target/incan_lock` and `target/incan` are removed.
      - name: Warm Oven extension sources
        run: |
          set -euo pipefail
          if make bake; then
            echo "Bake succeeded during warm-up; registry was already populated."
            exit 0
          fi
          echo "Bake could not resolve offline. Fetching what it generated."
          fetched=0
          for manifest in target/incan_lock/rust_inspect/*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            cargo fetch --manifest-path "$manifest"
            fetched=1
          done
          if [ "$fetched" -eq 0 ]; then
            echo "::error::No generated Cargo manifest to fetch from; the bake failed earlier than dependency resolution."
            exit 1
          fi
          rm -rf .incan target/incan_lock target/incan
          # The store is in INCAN_HOME, not the project, so the line above does
          # not touch it. Staging capacity for the real bake is the store limit
          # minus what is already retained, so anything the warm-up sealed comes
          # straight off the budget the real bake needs.
          incan oven store prune --max-physical-bytes 0 \
            --max-domain-physical-bytes 0 --max-domain-logical-bytes 0 \
            || echo "Nothing to prune from the Oven store."

      - name: Show toolchain
        run: |
          incan --version
          test "$(incan --version)" = "incan ${EXPECTED_INCAN_VERSION}"
          rustc --version
          test "$(rustc --version | awk '{ print $2 }')" = "${RUST_VERSION}"

      - name: Format check (package .incn)
        run: make fmt-check

      - name: Test style check
        run: make test-style


      - name: Bake Oven project authority
        run: make bake

      - name: Function registry metadata check
        run: make registry-metadata

      - name: Build library
        run: make build

      # Known red: blocked upstream on encero-systems/incan#1189 — `incan test`
      # cannot reconcile project inspection sources for a package whose Rust
      # dependency closure requires unified Cargo resolution, which IncQL's
      # datafusion/substrait closure does. Remove this comment when that lands.
      - name: Run tests
        run: make test

      - name: Pub consumer smoke check
        run: make smoke-consumer
