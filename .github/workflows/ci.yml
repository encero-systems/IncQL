# IncQL CI — Incan library package
#
# Builds the pinned Incan compiler from source, packages it the way Incan's own
# release workflow does, and runs the IncQL package checks against that
# toolchain.
#
# Why a source build rather than a release archive: IncQL tracks Incan's 0.6
# development line, whose versions are branches (`0.6.0-dev.<slice>[.<n>]`),
# not tagged releases, so there is no archive to download. INCAN_REF names one
# commit on that line. The packaged toolchain is cached under that commit, so
# the build is paid once per pin and per host, not once per run.
#
# Why the release packaging script rather than `cargo build` alone: since Incan
# 0.5, a project that declares a `[vocab]` companion (IncQL does — see
# `incan.toml`) needs a compiler-owned vocabulary helper drawn from a
# release-cohort Oven Loaf. A bare `cargo build` produces no Loafs. Incan's
# `workspaces/release/toolchain/package_archive.sh` seals them beside the
# binary (`share/incan/oven/loafs`), where the compiler looks for them, along
# with the SDK provider seed and the support crates. Running that script here
# gives CI the same layout an installed release has.
#
# Why the checkout stays on the job after the build: the packaged toolchain
# deliberately drops the stdlib component sources (`crates/incan_stdlib/stdlib`).
# `incan tools metadata api`, used by the registry-metadata gate, prepares SDK
# components from that tree, so INCAN_STDLIB points at the checkout.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned Incan commit on the 0.6 development line. Dev versions are branches,
  # so a branch name would drift under the pin; keep this a full commit SHA and
  # keep it in every compiler-dependent cache key, because several commits can
  # share one version string.
  INCAN_REF: 26db5aa8cb58de0e9e543c24cc19eb18c70eb60c
  EXPECTED_INCAN_VERSION: 0.6.0-dev.1.3
  # The Loafs the packaging step seals bind to the exact `rustc --version` that
  # sealed them and are verified against it, so this must name a concrete
  # version. A floating `stable` channel drifts out from under the cached
  # toolchain the moment upstream publishes a new compiler.
  RUST_VERSION: 1.98.0
  RUST_BACKTRACE: 1
  INCAN_NO_BANNER: 1
  INCAN_GENERATED_CARGO_TARGET_DIR: ${{ github.workspace }}/.incan-generated-cargo-target
  INCAN_TEST_SHARED_TARGET_DIR: ${{ github.workspace }}/.incan-generated-cargo-target
  # `oven bake` materializes debug and release unless told otherwise. `make ci`
  # builds and tests debug only, and the release half was ~77% of compiler time
  # for artifacts nothing here loads. Workflow-wide on purpose: `build` verifies
  # the inspection authority across the profile set the bake produced, so a
  # bake-only setting leaves the consumers disagreeing with the bake.
  INCAN_OVEN_BAKE_PROFILES: debug

jobs:
  incql:
    name: IncQL (build + test)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Check out IncQL
        uses: actions/checkout@v4

      # The compiler source at the pinned commit: built only on a toolchain
      # cache miss, always used for its stdlib component sources.
      - name: Check out Incan
        uses: actions/checkout@v4
        with:
          repository: encero-systems/incan
          ref: ${{ env.INCAN_REF }}
          path: incan

      # `targets` is not optional here: IncQL declares a `[vocab]` companion, and
      # its desugarer is compiled to wasm32-wasip1. The toolchain the official
      # installer provisions includes that target; a workflow that provisions
      # rustup itself has to add it, or `oven bake` stops with
      # "vocab desugarer target `wasm32-wasip1` is not installed".
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-wasip1
          components: llvm-tools

      - name: Cache Incan toolchain
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/incan-toolchain
          key: incql-incan-source-${{ runner.os }}-${{ matrix.target }}-${{ env.INCAN_REF }}-rust-${{ env.RUST_VERSION }}

      # Same commands as Incan's toolchain release workflow, minus its
      # cross-target build: the packaging script takes host binaries, and this
      # job only ever packages for the host it runs on. No Cargo build cache is
      # kept for this step on purpose: the packaged toolchain itself is cached
      # under the pinned commit, so this runs once per pin and per host.
      - name: Build and package Incan from source
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        working-directory: incan
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --locked --release --features lsp --bin incan --bin incan-lsp
          # package_archive.sh resolves its support workspace with
          # `cargo metadata --offline`; warm the registry while network access
          # is still expected, exactly as the release workflow does.
          workspaces/release/toolchain/fetch_release_support_workspace_sources.sh
          package_dir="${RUNNER_TEMP}/incan-package"
          INCAN_BIN=target/release/incan \
          INCAN_LSP_BIN=target/release/incan-lsp \
          TOOLCHAIN_RELEASE="v${EXPECTED_INCAN_VERSION}" \
            workspaces/release/toolchain/package_archive.sh "${TARGET}" --out-dir "${package_dir}"
          # The packaging records which rustc sealed the Loafs. A toolchain whose
          # Loafs the job's own rustc would reject is not worth caching.
          sealed="$(tr -d '[:space:]' < "${package_dir}/rust-channel-${TARGET}.txt")"
          if [ "${sealed}" != "${RUST_VERSION}" ]; then
            echo "::error::Oven Loafs were sealed by rustc ${sealed}, but this job pins ${RUST_VERSION}"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/incan-toolchain"
          tar -xzf "${package_dir}/incan-v${EXPECTED_INCAN_VERSION}-${TARGET}.tar.gz" \
            -C "${RUNNER_TEMP}/incan-toolchain"
          # Reclaim the compiler build tree before the IncQL bake stages its own
          # multi-GiB unified Cargo directory; nothing below reads it.
          rm -rf "${package_dir}" target

      - name: Expose Incan on PATH
        run: |
          set -euo pipefail
          echo "${{ runner.temp }}/incan-toolchain/bin" >> "$GITHUB_PATH"
          # The packaged toolchain ships no stdlib component sources; point it
          # at the checkout so SDK component preparation (used by
          # `incan tools metadata api`) can resolve them.
          stdlib="${{ github.workspace }}/incan/crates/incan_stdlib/stdlib"
          test -d "$stdlib" || { echo "::error::stdlib sources missing at $stdlib"; exit 1; }
          echo "INCAN_STDLIB=$stdlib" >> "$GITHUB_ENV"
          echo "INCAN_STDLIB_DIR=$stdlib" >> "$GITHUB_ENV"

      - name: Cache generated IncQL Cargo artifacts
        id: generated-cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: .incan-generated-cargo-target
          key: incql-generated-cargo-${{ runner.os }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('incan.lock', 'incan.toml') }}
          restore-keys: |
            incql-generated-cargo-${{ runner.os }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-rust-${{ env.RUST_VERSION }}-

      # Keyed on the lock and manifest only. Incan's own cache fingerprint hashes
      # the generated `Cargo.toml`/`Cargo.lock` and local path dependencies, not
      # `.incn` sources, so a key that also hashed the sources forced a
      # `restore-keys` fallback on every edit for no gain.
      - name: Cache generated IncQL Rust metadata
        id: rust-inspect-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target/incan_lock/rust_inspect/**/Cargo.toml
            target/incan_lock/rust_inspect/**/Cargo.lock
            target/incan_lock/rust_inspect/**/src/main.rs
            target/incan_lock/rust_inspect/**/.incan_rust_inspect_cache.json
            target/incan_lock/rust_inspect/**/.incan_rust_inspect_fingerprint
          key: incql-rust-inspect-${{ runner.os }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-${{ hashFiles('incan.lock', 'incan.toml') }}
          restore-keys: |
            incql-rust-inspect-${{ runner.os }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-

      # The packaged toolchain vendors only Incan's own crates by design; a
      # project's extension dependencies build from the consumer's `~/.cargo`,
      # resolved `--offline` by the Oven publisher. On a cold runner that fails
      # on the first extension crate it needs — for IncQL, `blake2`, pulled in by
      # the stdlib hashing components. Keyed on the lock, mirroring Incan's own
      # `incan-oven-pr-sources` cache.
      - name: Cache Cargo registry for Oven extension sources
        id: oven-sources-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incql-oven-sources-v1-${{ runner.os }}-${{ runner.arch }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-${{ hashFiles('incan.lock', 'incan.toml') }}
          restore-keys: |
            incql-oven-sources-v1-${{ runner.os }}-${{ runner.arch }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-
            incql-oven-sources-v1-${{ runner.os }}-${{ runner.arch }}-

      # The Oven store holds the sealed Loafs a bake produces: the project's
      # own and its dependency closure's. Loaf entries are immutable and
      # content-addressed, so a restored store lets `oven bake` reuse every
      # Loaf whose inputs did not change — the single largest saving available
      # to this job, measured locally at seconds against minutes cold. The key
      # hashes the sources because the project Loaf depends on them; the
      # fallbacks still hand a source edit its dependency Loafs.
      - name: Cache Oven store
        id: oven-store-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.incan/oven/store
          key: incql-oven-store-v1-${{ runner.os }}-${{ runner.arch }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('incan.lock', 'incan.toml') }}-${{ hashFiles('src/**/*.incn', 'tests/**/*.incn', 'scripts/**/*.incn') }}
          restore-keys: |
            incql-oven-store-v1-${{ runner.os }}-${{ runner.arch }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('incan.lock', 'incan.toml') }}-
            incql-oven-store-v1-${{ runner.os }}-${{ runner.arch }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-rust-${{ env.RUST_VERSION }}-

      # One online fetch before the bake, so a cold runner degrades to a slow
      # run rather than an aborted bake. `incan.lock` already names every
      # registry crate and exact version in the closure, so seed precisely
      # those rather than guessing.
      #
      # This matters beyond the immediate failure: a bake that stops mid-flight
      # damages the checkout's inspection authority (encero-systems/incan#1229),
      # and every later bake in that checkout then reports spurious `Box` type
      # errors until `.incan`, `target/incan_lock` and `target/incan` are
      # removed. Failing before the bake starts is much cheaper than failing
      # inside it.
      # Seeding from `incan.lock` is not enough: the project Cargo manifest that
      # Oven generates uses caret ranges (`blake2 = "0.10"`, `datafusion = "53"`),
      # so it resolves to the newest compatible versions rather than the lock's
      # pins. The only reliable description of what the bake needs is the
      # manifest the bake itself writes.
      #
      # So: let a first bake generate that manifest and fail offline, fetch what
      # it asked for while online, then clear the damaged state and let the real
      # bake step run against a warm registry.
      #
      # The clear is not optional. A bake that stops mid-flight damages the
      # checkout's inspection authority (encero-systems/incan#1229), and every
      # later bake in that checkout then reports spurious `Box` type errors —
      # `expected 'prost::alloc::boxed::Box<…>', found 'rust::std::boxed::Box'` —
      # until `.incan`, `target/incan_lock` and `target/incan` are removed.
      - name: Warm Oven extension sources
        run: |
          set -euo pipefail
          if make bake; then
            echo "Bake succeeded during warm-up; registry was already populated."
            echo "--- Oven store after the warm-up bake ---"
            incan oven store inspect || true
            python3 scripts/ci_oven_store_dump.py . || true
            exit 0
          fi
          echo "Bake could not resolve offline. Fetching what it generated."
          fetched=0
          for manifest in target/incan_lock/rust_inspect/*/Cargo.toml; do
            [ -f "$manifest" ] || continue
            cargo fetch --manifest-path "$manifest"
            fetched=1
          done
          if [ "$fetched" -eq 0 ]; then
            echo "::error::No generated Cargo manifest to fetch from; the bake failed earlier than dependency resolution."
            exit 1
          fi
          rm -rf .incan target/incan_lock target/incan
          # The store is in INCAN_HOME, not the project, so the line above does
          # not touch it. Staging capacity for the real bake is the store limit
          # minus what is already retained (`transient_limit_bytes` in Incan's
          # `src/oven/store.rs`), so toolchain-install leftovers come straight
          # off the budget the real bake needs for its ~3.4 GiB unified Cargo
          # staging directory.
          #
          # The floor is 1, not 0: `incan oven store prune` rejects a zero
          # policy outright ("Oven storage policy limits must be greater than
          # zero"), so a 0 here reclaims nothing at all. Print the store both
          # sides of the prune, and surface the exit status rather than hiding
          # it behind `||` — a prune that silently does nothing looks exactly
          # like a prune that worked, and the bake then fails an hour later
          # with an allowance nobody can account for.
          echo "--- Oven store before prune ---"
          incan oven store inspect || true
          if incan oven store prune --max-physical-bytes 1 \
            --max-domain-physical-bytes 1 --max-domain-logical-bytes 1; then
            echo "Pruned the Oven store."
          else
            echo "::warning::Oven store prune exited non-zero; the bake may be short on staging capacity."
          fi
          echo "--- Oven store after prune ---"
          incan oven store inspect || true

      - name: Show toolchain
        run: |
          incan --version
          test "$(incan --version)" = "incan ${EXPECTED_INCAN_VERSION}"
          rustc --version
          test "$(rustc --version | awk '{ print $2 }')" = "${RUST_VERSION}"

      - name: Format check (package .incn)
        run: make fmt-check

      - name: Test style check
        run: make test-style


      - name: Bake Oven project authority
        run: |
          set -euo pipefail
          make bake || bake_status=$?
          echo "--- Oven store after the bake ---"
          incan oven store inspect || true
          python3 scripts/ci_oven_store_dump.py . || true
          exit "${bake_status:-0}"

      - name: Function registry metadata check
        run: make registry-metadata

      - name: Build library
        run: make build

      - name: Run tests
        run: make test

      - name: Pub consumer smoke check
        run: make smoke-consumer

      # `actions/cache` only saves when the job succeeds. Every cache above was
      # therefore never written while this workflow was red: the repository held
      # two caches, both from the docs workflow, so each run re-downloaded the
      # toolchain, re-fetched 220 registry crates, and re-ran the rust-analyzer
      # inspection that is ~62% of a cold bake. Saving on `always()` decouples
      # "was this run green" from "is this artifact reusable" — the inputs a
      # cache key names have not changed just because a later step failed.

      - name: Save cache — Incan toolchain
        if: always() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/incan-toolchain
          key: incql-incan-source-${{ runner.os }}-${{ matrix.target }}-${{ env.INCAN_REF }}-rust-${{ env.RUST_VERSION }}

      - name: Save cache — generated IncQL Cargo artifacts
        if: always() && steps.generated-cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .incan-generated-cargo-target
          key: incql-generated-cargo-${{ runner.os }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('incan.lock', 'incan.toml') }}

      - name: Save cache — generated IncQL Rust metadata
        if: always() && steps.rust-inspect-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/incan_lock/rust_inspect/**/Cargo.toml
            target/incan_lock/rust_inspect/**/Cargo.lock
            target/incan_lock/rust_inspect/**/src/main.rs
            target/incan_lock/rust_inspect/**/.incan_rust_inspect_cache.json
            target/incan_lock/rust_inspect/**/.incan_rust_inspect_fingerprint
          key: incql-rust-inspect-${{ runner.os }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-${{ hashFiles('incan.lock', 'incan.toml') }}

      - name: Save cache — Cargo registry for Oven extension sources
        if: always() && steps.oven-sources-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incql-oven-sources-v1-${{ runner.os }}-${{ runner.arch }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-${{ hashFiles('incan.lock', 'incan.toml') }}

      - name: Save cache — Oven store
        if: always() && steps.oven-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.incan/oven/store
          key: incql-oven-store-v1-${{ runner.os }}-${{ runner.arch }}-incan-${{ env.EXPECTED_INCAN_VERSION }}-${{ env.INCAN_REF }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('incan.lock', 'incan.toml') }}-${{ hashFiles('src/**/*.incn', 'tests/**/*.incn', 'scripts/**/*.incn') }}
